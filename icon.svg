<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DAV.AUTOSHOP">
  <!--
    Значок вкладки: решётка радиатора BMW, «ноздри».

    Почему именно она. Это самая узнаваемая деталь марки и самая большая
    категория магазина — 94 позиции из 315. Гаечный ключ или шестерёнка
    подошли бы любому автосервису, а тут магазин внешнего обвеса.

    Почему без прорезей. На вкладке значок живёт в 16×16: вертикальные рёбра
    решётки на такой сетке сливаются в серое пятно. Остался силуэт — две
    сужающиеся книзу «ноздри» с зазором между ними, он читается и в 16px,
    и в 512px.

    Формат SVG, а не .ico: один файл на все размеры, всегда резкий, весит
    меньше килобайта. Тёмный фон нужен — на светлой панели браузера светлые
    ноздри без подложки исчезли бы.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0e11" />
  <path
    d="M5.8 10.2Q5.8 8.6 7.4 8.6h5.2q1.6 0 1.55 1.6l-.55 9.6q-.05 1.6-1.65 1.6H8.05q-1.6 0-1.65-1.6z"
    fill="#e8edf1"
  />
  <path
    d="M26.2 10.2Q26.2 8.6 24.6 8.6h-5.2q-1.6 0-1.55 1.6l.55 9.6q.05 1.6 1.65 1.6h3.9q1.6 0 1.65-1.6z"
    fill="#e8edf1"
  />
  <!-- Волосок фирменного голубого под решёткой: тот же акцент, что у кнопок.
       Единственная цветная деталь — больше на такой площади не читается. -->
  <rect x="8" y="23.6" width="16" height="2" rx="1" fill="#01a4fe" />
</svg>
